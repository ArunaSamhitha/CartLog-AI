name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - run: pytest -v
      - run: CARTLOG_MOCK=1 python benchmark.py --runs 8

  e2e:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: pip install -r backend/requirements.txt playwright && python -m playwright install --with-deps chromium
      - run: cd frontend && npm install && npm run build
      - name: Start API and UI
        run: |
          cd backend && CARTLOG_MOCK=1 CARTLOG_DB=/tmp/e2e.db nohup uvicorn cartlog.api:app --port 8000 > /tmp/api.log 2>&1 &
          cd frontend && nohup npx vite preview --port 4173 --strictPort > /tmp/ui.log 2>&1 &
          for i in $(seq 1 30); do curl -fs localhost:8000/api/health && curl -fs localhost:4173 > /dev/null && break; sleep 1; done
      - run: python e2e/smoke.py http://localhost:4173
      - if: always()
        run: cat /tmp/api.log
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: e2e-screenshot, path: e2e-result.png, if-no-files-found: ignore }
